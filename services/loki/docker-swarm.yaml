services:
  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - /root/services/loki/config-swarm.yaml:/etc/loki/loki-config.yml
      - loki_data:/loki
    networks:
      - mobility-network
    ports:
      - "5006:3100"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

volumes:
  loki_data:

networks:
  mobility-network:
    external: true
