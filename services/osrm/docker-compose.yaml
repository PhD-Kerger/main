services:
  osrm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osrm
    environment:
      # Name of the OSM file without the .osm.pbf extension, which is used 
      # in the start-osrm.sh script to determine the input and output file paths.
      # E.g. baden-wuerttemberg-latest.osm.pbf -> baden-wuerttemberg-latest
      - OSRM_NAME=karlsruhe-regbez-260429
    volumes:
      - ./data/osm/:/data:rw
    ports:
      - "5001:5000"
    networks:
      - mobility-network
    deploy:
      resources:
        limits:
          memory: 2g
 
networks:
  mobility-network:
    driver: bridge
    external: true
